<div class="bg-slate-50 dark:bg-gray-950 min-h-screen transition-colors duration-300">
  
  <div class="bg-primary py-20 px-4 transition-colors duration-300">
    <div class="max-w-7xl mx-auto text-center">
      <h1 class="text-4xl md:text-5xl font-heading font-extrabold mb-4 text-white">School Events</h1>
      <p class="text-lg opacity-90 text-white/90">Discover what's happening at Aspire International School.</p>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 py-16">
    <div class="space-y-12" id="dyn-events-page-list">
      
      <!-- Static Fallback Event -->
      <div class="bg-white dark:bg-gray-900 rounded-3xl overflow-hidden shadow-xl flex flex-col lg:flex-row hover:shadow-2xl transition-all duration-300 group border border-transparent dark:border-gray-700">
        <div class="lg:w-1/3 h-64 lg:h-auto overflow-hidden">
          <img 
            src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800" 
            alt="Annual Sports Meet" 
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
            referrerpolicy="no-referrer"
          />
        </div>
        <div class="p-8 lg:p-12 flex-1 flex flex-col justify-center">
          <div class="flex flex-wrap gap-6 text-sm font-bold text-primary mb-6 uppercase tracking-widest">
            <span class="flex items-center gap-2 bg-primary/10 dark:bg-primary/20 px-4 py-2 rounded-full transition-colors duration-300">
              <i data-lucide="calendar" class="w-[18px] h-[18px]"></i> November 15, 2026
            </span>
            <span class="flex items-center gap-2 bg-secondary/10 dark:bg-secondary/20 text-secondary dark:text-blue-400 px-4 py-2 rounded-full transition-colors duration-300">
              <i data-lucide="map-pin" class="w-[18px] h-[18px]"></i> School Stadium
            </span>
          </div>
          <h2 class="text-3xl md:text-4xl font-heading font-bold text-slate-900 dark:text-white mb-4 transition-colors duration-300">Annual Sports Meet</h2>
          <p class="text-slate-600 dark:text-gray-300 text-lg leading-relaxed mb-8 transition-colors duration-300">
            Join us for an exciting day of athletic competition and sportsmanship as our students showcase their talents in various track and field events.
          </p>
          <div class="flex gap-4">
              <button class="bg-primary hover:bg-primary-hover text-white px-8 py-3 rounded-full font-bold shadow-lg transition-all transform hover:-translate-y-1">
                  Remind Me
              </button>
          </div>
        </div>
      </div>
      
    </div>
  </div>

  <!-- Script to load Dynamic Events from CMS -->
  <script>
    document.addEventListener('appDataLoaded', function() {
      var list = document.getElementById('dyn-events-page-list');
      if (list && window.appData && window.appData.events && window.appData.events.length > 0) {
        list.innerHTML = window.appData.events.map(function(e) {
            var dateStr = new Date(e.event_date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            var locHtml = e.location ? '<span class="flex items-center gap-2 bg-secondary/10 dark:bg-secondary/20 text-secondary dark:text-blue-400 px-4 py-2 rounded-full transition-colors duration-300"><i data-lucide="map-pin" class="w-[18px] h-[18px]"></i> ' + e.location + '</span>' : '';
            var imgUrl = e.image_url || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800';
            
            return '<div class="bg-white dark:bg-gray-900 rounded-3xl overflow-hidden shadow-xl flex flex-col lg:flex-row hover:shadow-2xl transition-all duration-300 group border border-transparent dark:border-gray-700"><div class="lg:w-1/3 h-64 lg:h-auto overflow-hidden"><img src="' + imgUrl + '" alt="' + e.title + '" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" referrerpolicy="no-referrer" /></div><div class="p-8 lg:p-12 flex-1 flex flex-col justify-center"><div class="flex flex-wrap gap-6 text-sm font-bold text-primary mb-6 uppercase tracking-widest"><span class="flex items-center gap-2 bg-primary/10 dark:bg-primary/20 px-4 py-2 rounded-full transition-colors duration-300"><i data-lucide="calendar" class="w-[18px] h-[18px]"></i> ' + dateStr + '</span>' + locHtml + '</div><h2 class="text-3xl md:text-4xl font-heading font-bold text-slate-900 dark:text-white mb-4 transition-colors duration-300">' + e.title + '</h2><p class="text-slate-600 dark:text-gray-300 text-lg leading-relaxed mb-8 transition-colors duration-300">' + e.description + '</p><div class="flex gap-4"><button class="bg-primary hover:bg-primary-hover text-white px-8 py-3 rounded-full font-bold shadow-lg transition-all transform hover:-translate-y-1">Remind Me</button></div></div></div>';
        }).join('');
        lucide.createIcons();
      }
    });
  </script>
</div>
