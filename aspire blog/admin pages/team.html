<div class="main">
  <header class="topbar">
    <div class="page-title">Manage Team</div>
    <div class="admin-chip"><div class="admin-avatar" id="avatarInitial">A</div><span id="adminUsername">Admin</span></div>
  </header>
  <div class="content">
    <div class="table-card">
      <div class="card-header">
        <div class="card-title">Team Members</div>
        <button class="add-btn" onclick="toggleForm()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Member
        </button>
      </div>
      <div class="form-drawer" id="formDrawer">
        <form id="memberForm">
          <div class="form-grid">
            <div class="form-group"><label>Full Name *</label><input type="text" id="mName" placeholder="Dr. John Smith" required/></div>
            <div class="form-group"><label>Role / Designation *</label><input type="text" id="mRole" placeholder="Principal" required/></div>
            <div class="form-group"><label>Photo URL</label><input type="url" id="mImage" placeholder="https://…"/></div>
            <div class="form-group"><label>Display Order</label><input type="number" id="mOrder" placeholder="1" min="0" value="0"/></div>
            <div class="form-group full"><label>Bio / Short Description</label><textarea id="mBio" placeholder="Brief biography…"></textarea></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-cancel" onclick="toggleForm()">Cancel</button>
            <button type="submit" class="btn-save" id="saveBtn">Save Member</button>
          </div>
        </form>
      </div>
      <div id="tableContainer"><div class="loading"><div class="spinner"></div> Loading team…</div></div>
    </div>

<script>
  const sb = window.sbClient;

  const adminUser = (window.sbSession && window.sbSession.user.email) || 'Admin';
  document.getElementById('adminUsername').textContent = adminUser;
  document.getElementById('avatarInitial').textContent = adminUser.charAt(0).toUpperCase();
  function handleLogout() { (window.sbClient || window.supabase.createClient('https://mhwszwdhyluraydnexyn.supabase.co','sb_publishable_jZFjyR57wQumHEQ8pjFPRg_zZh8PMp0')).auth.signOut().then(function(){ window.location.replace('https://hgvghfhg.blogspot.com/p/login.html'); }); }

  function showToast(msg, color = '#16a34a') { const t = document.getElementById('toast'); t.textContent = msg; t.style.background = color; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  function toggleForm() { document.getElementById('formDrawer').classList.toggle('open'); }

  let team = [];
  async function loadTeam() {
    const { data } = await sb.from('team_members').select('*').order('display_order');
    team = data || [];
    renderTable();
  }

  function renderTable() {
    const c = document.getElementById('tableContainer');
    if (team.length === 0) { c.innerHTML = '<div class="empty-state">👥 No team members added yet.</div>'; return; }
    c.innerHTML = `<div style="overflow-x:auto"><table>
      <thead><tr><th>Member</th><th>Role</th><th>Order</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody>${team.map(m => `<tr>
        <td><div class="member-cell"><img class="member-avatar" src="${m.image_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&background=6366f1&color=fff`}" alt="${m.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&background=6366f1&color=fff'"/><div><div class="member-name">${m.name}</div>${m.bio ? `<div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.bio}</div>` : ''}</div></div></td>
        <td style="color:var(--text-muted);font-weight:500">${m.role}</td>
        <td style="color:var(--text-muted)">#${m.display_order}</td>
        <td style="text-align:right"><button class="btn-icon" onclick="deleteMember('${m.id}')" title="Delete"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button></td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }

  document.getElementById('memberForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    const { error } = await sb.from('team_members').insert({
      name: document.getElementById('mName').value.trim(),
      role: document.getElementById('mRole').value.trim(),
      bio: document.getElementById('mBio').value.trim() || null,
      image_url: document.getElementById('mImage').value.trim() || null,
      display_order: parseInt(document.getElementById('mOrder').value) || 0
    });
    if (!error) {
      e.target.reset();
      document.getElementById('formDrawer').classList.remove('open');
      showToast('✓ Team member added!');
      loadTeam();
    } else showToast('✗ Failed to add member.', '#dc2626');
    btn.disabled = false; btn.textContent = 'Save Member';
  });

  async function deleteMember(id) {
    if (!confirm('Remove this team member?')) return;
    const { error } = await sb.from('team_members').delete().eq('id', id);
    if (!error) { showToast('✓ Member removed.'); loadTeam(); }
    else showToast('✗ Failed to remove.', '#dc2626');
  }

  window.__pageInit = function() { loadTeam() };
  if (window.__aspireReady) window.__pageInit();
</script>
