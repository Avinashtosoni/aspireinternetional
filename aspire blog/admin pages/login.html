          <div class="form-group">

            <input class="form-input" type="email" id="adminEmail" placeholder="admin@aspireschool.in" required
              autocomplete="email" />

          <div class="form-group">
            <label class="form-label" for="password">Password</label>

              <input class="form-input" type="password" id="password" placeholder="••••••••" required
                autocomplete="current-password" />
              <button type="button" class="toggle-btn" id="toggleBtn">
                <svg id="eyeShow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"

                <svg id="eyeHide" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <line x1="1" y1="1" x2="23" y2="23" />

    <script>
      // sbClient is set by guard script above
      function togglePassword() {
        const pwd = document.getElementById('password');
        const show = document.getElementById('eyeShow');
        const hide = document.getElementById('eyeHide');
        if (pwd.type === 'password') {
          pwd.type = 'text'; show.style.display = 'none'; hide.style.display = 'block';
        } else {
          pwd.type = 'password'; show.style.display = 'block'; hide.style.display = 'none';
        }
      }

      function showError(msg) {
        const box = document.getElementById('errorBox');
        document.getElementById('errorMsg').textContent = msg;
        box.classList.add('show');
      }

      function hideError() { document.getElementById('errorBox').classList.remove('show'); }

      async function handleLogin(e) {
        e.preventDefault();
        hideError();
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Authenticating...';

        try {
          // Use Supabase Auth — real JWT session
          const sb = window.sbClient || window.supabase.createClient(
            'https://mhwszwdhyluraydnexyn.supabase.co',
            'sb_publishable_jZFjyR57wQumHEQ8pjFPRg_zZh8PMp0'
          );
          const { data, error } = await sb.auth.signInWithPassword({ email, password });

          if (error || !data.session) {
            showError(error ? error.message : 'Invalid email or password.');
          } else {
            // Session saved by Supabase automatically
            btn.innerHTML = '✓ Success! Redirecting...';
            setTimeout(() => {
              window.location.replace('https://hgvghfhg.blogspot.com/p/dashboard.html');
            }, 600);
            return;
          }
        } catch (err) {
          showError('Network error. Please check your connection.');
        }

        btn.disabled = false;
        btn.innerHTML = 'Sign In to Dashboard';
      }

      // Attach Event Listeners to bypass Blogger's inline script stripping
      document.addEventListener('DOMContentLoaded', function () {
        const loginForm = document.getElementById('loginForm');
        if (loginForm) loginForm.addEventListener('submit', handleLogin);

        const tbtn = document.getElementById('toggleBtn');
        if (tbtn) tbtn.addEventListener('click', togglePassword);
      });

      // Sub-fallback in case DOMContentLoaded already fired
      setTimeout(function () {
        const loginForm = document.getElementById('loginForm');
        if (loginForm && !loginForm.getAttribute('data-bound')) {
          loginForm.addEventListener('submit', handleLogin);
          loginForm.setAttribute('data-bound', 'true');
        }
        const tbtn = document.getElementById('toggleBtn');
        if (tbtn && !tbtn.getAttribute('data-bound')) {
          tbtn.addEventListener('click', togglePassword);
          tbtn.setAttribute('data-bound', 'true');
        }
      }, 500);

    </script>
