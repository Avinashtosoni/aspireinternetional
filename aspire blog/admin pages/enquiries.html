<script>
  const sb = window.sbClient;

  const adminUser = (window.sbSession && window.sbSession.user.email) || 'Admin';
  document.getElementById('adminUsername').textContent = adminUser;
  document.getElementById('avatarInitial').textContent = adminUser.charAt(0).toUpperCase();

  function handleLogout() { (window.sbClient || window.supabase.createClient('https://mhwszwdhyluraydnexyn.supabase.co','sb_publishable_jZFjyR57wQumHEQ8pjFPRg_zZh8PMp0')).auth.signOut().then(function(){ window.location.replace('https://hgvghfhg.blogspot.com/p/login.html'); }); }

  let allEnquiries = [];
  let selectedEnq = null;

  function getSource(msg) { return msg && msg.includes('[Subject:') ? 'Contact' : 'Admission'; }
  function fmtDate(d) { return new Date(d).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }); }

  async function loadEnquiries() {
    const { data, error } = await sb.from('enquiries').select('*').order('created_at', { ascending: false });
    allEnquiries = data || [];
    applyFilters();
  }

  function applyFilters() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const filtered = allEnquiries.filter(e => {
      const matchStatus = status === 'all' || e.status === status;
      const matchSearch = !q || e.name.toLowerCase().includes(q) || (e.email||'').toLowerCase().includes(q) || (e.phone||'').includes(q);
      return matchStatus && matchSearch;
    });
    document.getElementById('countChip').textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''}`;
    renderTable(filtered);
  }

  function renderTable(list) {
    const container = document.getElementById('tableContainer');
    if (list.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div>No enquiries match your filters.</div></div>';
      return;
    }
    container.innerHTML = `<div style="overflow-x:auto"><table>
      <thead><tr><th>Date</th><th>Source</th><th>Name</th><th>Contact</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody>${list.map(e => {
        const src = getSource(e.message);
        return `<tr class="${e.status === 'unread' ? 'unread-row' : ''}">
          <td style="color:var(--text-muted);white-space:nowrap">${fmtDate(e.created_at)}</td>
          <td><span class="badge badge-${src === 'Contact' ? 'contact' : 'admission'}">${src}</span></td>
          <td style="font-weight:${e.status === 'unread' ? '700' : '500'}">${e.name}</td>
          <td style="color:var(--text-muted)"><div>${e.email || '–'}</div><div style="font-size:0.8rem">${e.phone || ''}</div></td>
          <td><span class="badge badge-${e.status}">${e.status.toUpperCase()}</span></td>
          <td style="text-align:right">
            <button class="action-btn btn-view" onclick='openModal(${JSON.stringify(e)})' title="View">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button class="action-btn btn-delete" onclick="deleteEnq('${e.id}')" title="Delete">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
  }

  function openModal(enq) {
    selectedEnq = enq;
    document.getElementById('modal').classList.add('open');
    document.getElementById('detailGrid').innerHTML = `
      <div class="detail-item"><label>Full Name</label><p>${enq.name}</p></div>
      <div class="detail-item"><label>Received On</label><p>${new Date(enq.created_at).toLocaleString('en-IN')}</p></div>
      <div class="detail-item"><label>Email</label><a href="mailto:${enq.email}">${enq.email || '–'}</a></div>
      <div class="detail-item"><label>Phone</label><a href="tel:${enq.phone}">${enq.phone || '–'}</a></div>
      <div class="detail-item"><label>Status</label><span class="badge badge-${enq.status}" style="font-size:0.75rem;padding:0.3rem 0.75rem">${enq.status.toUpperCase()}</span></div>
      <div class="detail-item"><label>Source</label><span class="badge badge-${getSource(enq.message) === 'Contact' ? 'contact' : 'admission'}" style="font-size:0.75rem;padding:0.3rem 0.75rem">${getSource(enq.message)}</span></div>`;
    document.getElementById('detailMsg').textContent = enq.message || 'No message.';
    updateModalBtns(enq.status);
    if (enq.status === 'unread') updateStatus(enq.id, 'read');
  }

  function updateModalBtns(status) {
    const btn = document.getElementById('modalBtns');
    if (status !== 'resolved') {
      btn.innerHTML = `<button class="btn btn-success" onclick="updateStatus('${selectedEnq.id}','resolved')">✓ Mark Resolved</button>`;
    } else {
      btn.innerHTML = `<button class="btn btn-warning" onclick="updateStatus('${selectedEnq.id}','unread')">↺ Re-open</button>`;
    }
  }

  async function updateStatus(id, status) {
    await sb.from('enquiries').update({ status }).eq('id', id);
    const idx = allEnquiries.findIndex(e => e.id === id);
    if (idx > -1) allEnquiries[idx].status = status;
    if (selectedEnq && selectedEnq.id === id) { selectedEnq.status = status; updateModalBtns(status); }
    applyFilters();
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); selectedEnq = null; }

  async function deleteSelected() {
    if (!selectedEnq) return;
    if (!confirm('Delete this enquiry permanently?')) return;
    await deleteEnq(selectedEnq.id);
    closeModal();
  }

  async function deleteEnq(id) {
    if (!confirm('Delete this enquiry permanently?')) return;
    await sb.from('enquiries').delete().eq('id', id);
    allEnquiries = allEnquiries.filter(e => e.id !== id);
    applyFilters();
  }

  document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

  window.__pageInit = function() { loadEnquiries() };
  if (window.__aspireReady) window.__pageInit();
</script>
</body>
</html>
