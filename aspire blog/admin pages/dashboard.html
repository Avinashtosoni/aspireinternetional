<script>
  const sb = window.sbClient;
  const adminUser = (window.sbSession && window.sbSession.user.email) || 'Admin';
  document.getElementById('adminUsername').textContent = adminUser;
  document.getElementById('avatarInitial').textContent = adminUser.charAt(0).toUpperCase();

  function handleLogout() { sb.auth.signOut().then(function(){ window.location.replace('https://hgvghfhg.blogspot.com/p/login.html'); }); }

  function getSource(msg) {
    return msg && msg.includes('[Subject:') ? 'Contact' : 'Admission';
  }

  async function loadDashboard() {
    const [enqRes, teamRes, blogsRes] = await Promise.all([
      sb.from('enquiries').select('*').order('created_at', { ascending: false }),
      sb.from('team_members').select('id'),
      sb.from('blogs').select('id')
    ]);

    const enquiries = enqRes.data || [];
    const unread = enquiries.filter(e => e.status === 'unread');

    document.getElementById('totalEnq').textContent = enquiries.length;
    document.getElementById('unreadEnq').textContent = unread.length;
    document.getElementById('teamCount').textContent = (teamRes.data || []).length;
    document.getElementById('blogsCount').textContent = (blogsRes.data || []).length;

    if (unread.length > 0) {
      const badge = document.getElementById('unreadBadge');
      badge.textContent = unread.length;
      badge.style.display = 'flex';
    }

    const recent = enquiries.slice(0, 5);
    const container = document.getElementById('tableContainer');

    if (recent.length === 0) {
      container.innerHTML = '<div class="empty-state">No enquiries yet.</div>';
      return;
    }

    container.innerHTML = `
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Source</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${recent.map(e => {
              const src = getSource(e.message);
              const date = new Date(e.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
              return `
                <tr>
                  <td style="color:var(--text-muted)">${date}</td>
                  <td><span class="badge ${src === 'Contact' ? 'badge-contact' : 'badge-admission'}">${src}</span></td>
                  <td style="font-weight:600">${e.name}</td>
                  <td style="color:var(--text-muted)">${e.phone || '–'}</td>
                  <td><span class="badge badge-${e.status}">${e.status.toUpperCase()}</span></td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  window.__pageInit = function() { loadDashboard() };
  if (window.__aspireReady) window.__pageInit();
</script>
</body>
</html>
