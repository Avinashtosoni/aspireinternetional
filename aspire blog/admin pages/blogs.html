<script>
  const sb = window.sbClient;

  const adminUser = (window.sbSession && window.sbSession.user.email) || 'Admin';
  document.getElementById('adminUsername').textContent = adminUser;
  document.getElementById('avatarInitial').textContent = adminUser.charAt(0).toUpperCase();
  function handleLogout() { (window.sbClient || window.supabase.createClient('https://mhwszwdhyluraydnexyn.supabase.co','sb_publishable_jZFjyR57wQumHEQ8pjFPRg_zZh8PMp0')).auth.signOut().then(function(){ window.location.replace('https://hgvghfhg.blogspot.com/p/login.html'); }); }

  function showToast(msg, color = '#16a34a') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.background = color; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  let blogs = [];
  async function loadBlogs() {
    const { data } = await sb.from('blogs').select('*').order('created_at', { ascending: false });
    blogs = data || [];
    document.getElementById('blogsCount').textContent = `${blogs.length} Post${blogs.length !== 1 ? 's' : ''}`;
    renderTable();
  }

  function renderTable() {
    const c = document.getElementById('tableContainer');
    if (blogs.length === 0) { c.innerHTML = '<div class="empty-state">📭 No posts published yet. Write your first one above!</div>'; return; }
    c.innerHTML = `<div style="overflow-x:auto"><table>
      <thead><tr><th>Title</th><th>Category</th><th>Author</th><th>Date</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody>${blogs.map(b => `<tr>
        <td style="font-weight:600;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${b.title}</td>
        <td><span class="badge" style="background:rgba(99,102,241,0.1);color:var(--primary)">${b.category || 'General'}</span></td>
        <td style="color:var(--text-muted)">${b.author || 'Admin'}</td>
        <td style="color:var(--text-muted);white-space:nowrap">${new Date(b.created_at).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'})}</td>
        <td style="text-align:right"><button class="btn-icon" onclick="deleteBlog('${b.id}')" title="Delete"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button></td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }

  document.getElementById('blogForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const title = document.getElementById('bTitle').value.trim();
    const content = document.getElementById('bContent').value.trim();
    if (!title || !content) return;
    btn.disabled = true; btn.textContent = 'Publishing…';
    const { error } = await sb.from('blogs').insert({
      title, content,
      author: document.getElementById('bAuthor').value.trim() || 'Admin',
      category: document.getElementById('bCategory').value.trim() || 'General',
      image_url: document.getElementById('bImage').value.trim() || null
    });
    if (!error) {
      document.getElementById('bTitle').value = '';
      document.getElementById('bContent').value = '';
      document.getElementById('bImage').value = '';
      showToast('✓ Blog post published successfully!');
      loadBlogs();
    } else { showToast('✗ Failed to publish. Try again.', '#dc2626'); }
    btn.disabled = false;
    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Publish Blog Post';
  });

  async function deleteBlog(id) {
    if (!confirm('Delete this blog post permanently?')) return;
    const { error } = await sb.from('blogs').delete().eq('id', id);
    if (!error) { showToast('✓ Post deleted.'); loadBlogs(); }
    else showToast('✗ Failed to delete.', '#dc2626');
  }

  window.__pageInit = function() { loadBlogs() };
  if (window.__aspireReady) window.__pageInit();
</script>
