<script>
  const sb = window.sbClient;

  const adminUser = (window.sbSession && window.sbSession.user.email) || 'Admin';
  document.getElementById('adminUsername').textContent = adminUser;
  document.getElementById('avatarInitial').textContent = adminUser.charAt(0).toUpperCase();
  function handleLogout() { (window.sbClient || window.supabase.createClient('https://mhwszwdhyluraydnexyn.supabase.co','sb_publishable_jZFjyR57wQumHEQ8pjFPRg_zZh8PMp0')).auth.signOut().then(function(){ window.location.replace('https://hgvghfhg.blogspot.com/p/login.html'); }); }

  function showToast(msg, color = '#16a34a') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.background = color; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  let events = [];
  async function loadEvents() {
    const { data } = await sb.from('events').select('*').order('event_date', { ascending: false });
    events = data || [];
    document.getElementById('eventsCount').textContent = `${events.length} Event${events.length !== 1 ? 's' : ''}`;
    renderGrid();
  }

  function renderGrid() {
    const c = document.getElementById('eventsGrid');
    if (events.length === 0) {
      c.innerHTML = '<div class="empty-state">📅 No events added yet. Add your first event above!</div>';
      return;
    }
    c.innerHTML = `<div class="events-grid">${events.map(ev => `
      <div class="event-card">
        <div class="event-img">
          <img src="${ev.image_url || 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=400'}" alt="${ev.title}" onerror="this.src='https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=400'"/>
          <button class="event-del-btn" onclick="deleteEvent('${ev.id}')" title="Delete">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
        <div class="event-body">
          <div class="event-title">${ev.title}</div>
          <div class="event-meta">
            <span><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${new Date(ev.event_date).toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'})}</span>
            ${ev.location ? `<span><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${ev.location}</span>` : ''}
          </div>
          ${ev.description ? `<p style="font-size:0.8rem;color:var(--text-muted);margin-top:0.5rem;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${ev.description}</p>` : ''}
        </div>
      </div>`).join('')}</div>`;
  }

  document.getElementById('eventForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Adding Event…';
    const { error } = await sb.from('events').insert({
      title: document.getElementById('eTitle').value.trim(),
      event_date: document.getElementById('eDate').value,
      location: document.getElementById('eLocation').value.trim() || null,
      image_url: document.getElementById('eImage').value.trim() || null,
      description: document.getElementById('eDesc').value.trim() || null
    });
    if (!error) {
      e.target.reset();
      showToast('✓ Event added successfully!');
      loadEvents();
    } else showToast('✗ Failed to add event.', '#dc2626');
    btn.disabled = false;
    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add School Event';
  });

  async function deleteEvent(id) {
    if (!confirm('Delete this event permanently?')) return;
    const { error } = await sb.from('events').delete().eq('id', id);
    if (!error) { showToast('✓ Event deleted.'); loadEvents(); }
    else showToast('✗ Failed to delete.', '#dc2626');
  }

  window.__pageInit = function() { loadEvents() };
  if (window.__aspireReady) window.__pageInit();
</script>
</body>
</html>
