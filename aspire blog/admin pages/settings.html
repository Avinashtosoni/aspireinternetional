    }
  ];

  // ── Render UI ───────────────────────────────────────────────────────────────
  function buildUI() {
    const container = document.getElementById('mainContent');
    let html = '<div id="successBanner" class="success-banner">✓ Settings saved successfully!</div>';

    sections.forEach(sec => {
      html += `
        <div class="settings-card">
          <div class="section-head">
            <div class="section-icon" style="background:${sec.iconBg};color:${sec.iconColor}">${sec.iconSvg}</div>
            <div class="section-title">${sec.title}</div>
          </div>
          <div class="section-body">
            <div class="${sec.gridClass}">
              ${sec.fields.map(f => `
                <div class="form-group ${f.full ? 'full' : ''}">
                  <label for="${f.key}">${f.label}</label>
                  ${f.type === 'textarea'
                    ? `<textarea id="${f.key}" placeholder="${f.placeholder || ''}" oninput="onFieldChange('${f.key}', this.value)"></textarea>`
                    : `<input type="${f.type}" id="${f.key}" placeholder="${f.placeholder || ''}" oninput="onFieldChange('${f.key}', this.value)"/>`
                  }
                </div>`).join('')}
            </div>
          </div>
        </div>`;
    });

    html += `
      <div class="notice-box">
        <div class="notice-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div>
          <div class="notice-title">Important Note</div>
          <div class="notice-text">Changes made here will instantly reflect on the public website. Make sure all image URLs are valid and publicly accessible before saving.</div>
        </div>
      </div>`;

    container.innerHTML = html;

    // Now populate field values from localSettings
    populateFields();
  }

  function populateFields() {
    sections.forEach(sec => {
      sec.fields.forEach(f => {
        const el = document.getElementById(f.key);
        if (el) el.value = localSettings[f.key] || '';
      });
    });
  }

  function onFieldChange(key, value) {
    localSettings[key] = value;
  }

  // ── Load from Supabase ──────────────────────────────────────────────────────
  async function loadSettings() {
    const { data, error } = await sb.from('school_settings').select('key, value');
    if (error) {
      showToast('✗ Failed to load settings.', '#dc2626');
      document.getElementById('mainContent').innerHTML = '<div class="loading-page" style="color:#ef4444">Failed to load settings. Check your Supabase connection.</div>';
      return;
    }

    savedSettings = {};
    (data || []).forEach(row => {
      savedSettings[row.key] = row.value;
    });
    localSettings = { ...savedSettings };
    buildUI();
  }

  // ── Save to Supabase ────────────────────────────────────────────────────────
  async function saveAll() {
    const btn = document.getElementById('saveAllBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="border-top-color:white;width:16px;height:16px;border-width:2px"></div> Saving…';

    const allKeys = sections.flatMap(s => s.fields.map(f => f.key));
    let savedCount = 0;
    let errors = 0;

    for (const key of allKeys) {
      const newVal = (localSettings[key] || '').trim();
      const oldVal = (savedSettings[key] || '').trim();
      if (newVal === oldVal) continue; // skip unchanged

      const { error } = await sb.from('school_settings')
        .upsert({ key, value: newVal }, { onConflict: 'key' });

      if (!error) {
        savedSettings[key] = newVal;
        savedCount++;
      } else {
        errors++;
      }
    }

    btn.disabled = false;
    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save All Changes';

    if (errors > 0) {
      showToast(`✗ ${errors} setting(s) failed to save.`, '#dc2626');
    } else if (savedCount === 0) {
      showToast('ℹ No changes to save.', '#475569');
    } else {
      showToast(`✓ ${savedCount} setting(s) saved successfully!`);
      const banner = document.getElementById('successBanner');
      if (banner) { banner.classList.add('show'); setTimeout(() => banner.classList.remove('show'), 4000); }
    }
  }

  // ── Init ────────────────────────────────────────────────────────────────────
  window.__pageInit = function() { loadSettings() };
  if (window.__aspireReady) window.__pageInit();
</script>
</body>
</html>
