<script>
  const sb = window.sbClient;

  const adminUser = (window.sbSession && window.sbSession.user.email) || 'Admin';
  document.getElementById('adminUsername').textContent = adminUser;
  document.getElementById('avatarInitial').textContent = adminUser.charAt(0).toUpperCase();
  function handleLogout() { (window.sbClient || window.supabase.createClient('https://mhwszwdhyluraydnexyn.supabase.co','sb_publishable_jZFjyR57wQumHEQ8pjFPRg_zZh8PMp0')).auth.signOut().then(function(){ window.location.replace('https://hgvghfhg.blogspot.com/p/login.html'); }); }

  function showToast(msg, color = '#16a34a') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.background = color; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  let notices = [];
  async function loadNotices() {
    const { data } = await sb.from('notices').select('*').order('created_at', { ascending: false });
    notices = data || [];
    renderNotices();
  }

  function renderNotices() {
    const c = document.getElementById('noticesList');
    if (notices.length === 0) { c.innerHTML = '<div class="empty-state">📢 No notices posted yet. Add one above!</div>'; return; }
    c.innerHTML = notices.map(n => `
      <div class="notice-item">
        <div class="notice-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <div class="notice-text">
          <div class="notice-content">${n.content}</div>
          <div class="notice-date">Posted on ${new Date(n.created_at).toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'})}</div>
        </div>
        <button class="notice-del-btn" onclick="deleteNotice('${n.id}')" title="Delete">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>`).join('');
  }

  async function addNotice(e) {
    e.preventDefault();
    const content = document.getElementById('noticeInput').value.trim();
    if (!content) return;
    const btn = document.getElementById('addBtn');
    btn.disabled = true; btn.textContent = 'Posting…';
    const { error } = await sb.from('notices').insert({ content, is_active: true, display_order: notices.length + 1 });
    if (!error) { document.getElementById('noticeInput').value = ''; showToast('✓ Notice posted!'); loadNotices(); }
    else showToast('✗ Failed to post notice.', '#dc2626');
    btn.disabled = false;
    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Notice';
  }

  async function deleteNotice(id) {
    if (!confirm('Delete this notice?')) return;
    const { error } = await sb.from('notices').delete().eq('id', id);
    if (!error) { showToast('✓ Notice deleted.'); loadNotices(); }
    else showToast('✗ Failed to delete.', '#dc2626');
  }

  window.__pageInit = function() { loadNotices() };
  if (window.__aspireReady) window.__pageInit();
</script>
